<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Move Day -- VYV Moving</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Poppins',sans-serif;background:#f0ecf8;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:24px 16px 40px;}

  .logo-bar{text-align:center;margin-bottom:24px;}
  .logo-name{font-size:1rem;font-weight:800;color:#190E2A;letter-spacing:0.02em;}
  .logo-sub{font-size:0.65rem;color:#8B5BC7;margin-top:2px;}

  .card{background:#fff;border-radius:20px;box-shadow:0 4px 28px rgba(25,14,42,0.10);width:100%;max-width:420px;overflow:hidden;}

  /* status states */
  .card-header{padding:24px 24px 20px;text-align:center;border-bottom:1px solid #f0ecf8;}
  .status-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 14px;border-radius:50px;font-size:0.62rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:12px;}
  .badge-arrived{background:#fef3c7;border:1px solid #f59e0b;color:#92400e;}
  .badge-progress{background:#d4eddf;border:1px solid #9dd0b4;color:#166534;}
  .badge-done{background:#e0e7ff;border:1px solid #a5b4fc;color:#3730a3;}

  .card-title{font-size:1.3rem;font-weight:800;color:#190E2A;line-height:1.2;margin-bottom:6px;}
  .card-title span{color:#4A237A;}
  .card-sub{font-size:0.78rem;color:#6b5b8a;line-height:1.5;}

  /* booking info strip */
  .info-strip{display:flex;justify-content:space-around;padding:14px 20px;background:#faf8ff;border-bottom:1px solid #e6dff5;gap:8px;}
  .info-item{text-align:center;flex:1;}
  .info-label{font-size:0.55rem;font-weight:700;color:#8B5BC7;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:3px;}
  .info-val{font-size:0.75rem;font-weight:700;color:#190E2A;}

  /* timer */
  .timer-block{padding:28px 24px;text-align:center;}
  .timer-label{font-size:0.62rem;font-weight:700;color:#8B5BC7;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:10px;}
  .timer-display{font-size:3.2rem;font-weight:800;color:#190E2A;letter-spacing:0.04em;font-variant-numeric:tabular-nums;line-height:1;}
  .timer-note{font-size:0.68rem;color:#a892cc;margin-top:8px;}

  /* sign-in section */
  .signin-section{padding:28px 24px;text-align:center;}
  .truck-emoji{font-size:3.5rem;margin-bottom:12px;display:block;}
  .signin-title{font-size:1.1rem;font-weight:800;color:#190E2A;margin-bottom:8px;}
  .signin-sub{font-size:0.78rem;color:#6b5b8a;line-height:1.55;margin-bottom:20px;}

  .btn-signin{display:block;width:100%;background:#16a34a;color:#fff;font-family:'Poppins',sans-serif;font-size:1rem;font-weight:800;padding:16px;border:none;border-radius:12px;cursor:pointer;letter-spacing:0.04em;box-shadow:0 4px 16px rgba(22,163,74,0.30);transition:opacity 0.15s;}
  .btn-signin:hover{opacity:0.9;}
  .btn-signin:disabled{background:#ccc;box-shadow:none;cursor:default;}
  .btn-signin.loading{background:#0f7a35;}

  .warning-note{font-size:0.68rem;color:#ef4444;margin-top:10px;font-weight:600;}

  /* done state */
  .done-section{padding:28px 24px;text-align:center;}
  .done-icon{font-size:3rem;margin-bottom:12px;display:block;}
  .done-title{font-size:1.2rem;font-weight:800;color:#190E2A;margin-bottom:6px;}
  .done-sub{font-size:0.78rem;color:#6b5b8a;line-height:1.55;}

  /* receipt row */
  .receipt-strip{border-top:1px solid #e6dff5;padding:16px 24px;}
  .receipt-row{display:flex;justify-content:space-between;font-size:0.75rem;padding:5px 0;border-bottom:1px solid #f5f3ff;}
  .receipt-row:last-child{border-bottom:none;}
  .r-label{color:#6b5b8a;}
  .r-val{font-weight:700;color:#190E2A;}
  .r-total .r-label{color:#4A237A;font-weight:700;}
  .r-total .r-val{color:#4A237A;font-size:0.88rem;}
  .r-charged{background:#d4eddf;margin:0 -24px;padding:8px 24px;border-radius:0 0 8px 8px;}
  .r-charged .r-label,.r-charged .r-val{color:#166534;font-weight:700;}

  .footer-contact{padding:16px 24px 0;text-align:center;font-size:0.7rem;color:#a892cc;border-top:1px solid #e6dff5;}
  .footer-contact a{color:#8B5BC7;font-weight:600;text-decoration:none;}

  /* loading / error */
  .loading-wrap{text-align:center;padding:48px 24px;color:#8B5BC7;font-size:0.85rem;}
  .error-wrap{text-align:center;padding:48px 24px;color:#ef4444;font-size:0.85rem;}
  .spinner{width:32px;height:32px;border:3px solid #e6dff5;border-top-color:#8B5BC7;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 12px;}
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>

<div class="logo-bar">
  <div class="logo-name">Validate Your Vision Moving</div>
  <div class="logo-sub">Fredericksburg, VA &middot; Licensed &amp; Insured</div>
</div>

<div class="card" id="main-card">
  <div class="loading-wrap">
    <div class="spinner"></div>
    Loading your move details...
  </div>
</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzIfSX5ZR-3jrzwYZsJEzbDagQgTQN9CTuzQHyVhRKn2lYoD8zgmbGYpsijjPxT3hLo/exec';

const params    = new URLSearchParams(window.location.search);
const bookingId = params.get('id')       || '';
const moveToken = params.get('moveToken') || '';

let timerInterval = null;
let pollInterval  = null;
let currentBooking = null;

async function fetchMove() {
  if (!bookingId || !moveToken) {
    showError('Invalid link. Please use the link from your text or email.');
    return;
  }
  try {
    const r = await fetch(`${SCRIPT_URL}?action=get_move&id=${encodeURIComponent(bookingId)}&moveToken=${encodeURIComponent(moveToken)}`);
    const d = await r.json();
    if (!d.ok) { showError('This link is invalid or has expired. Text us at (540) 300-1414.'); return; }
    currentBooking = d.booking;
    render(d.booking);
  } catch {
    showError('Unable to load. Check your connection and refresh.');
  }
}

function render(b) {
  const status = (b.status || '').toLowerCase();

  // Build info strip
  const crew      = b.crew || '--';
  const moveDate  = (b.moveDate || '--').split(' ').slice(0,4).join(' ');
  const from      = cityOnly(b.from);
  const to        = cityOnly(b.to);
  const firstName = (b.name || '').split(' ')[0];

  const infoStrip = `
    <div class="info-strip">
      <div class="info-item"><div class="info-label">Date</div><div class="info-val">${moveDate}</div></div>
      <div class="info-item"><div class="info-label">Crew</div><div class="info-val">${crew}</div></div>
      <div class="info-item"><div class="info-label">Route</div><div class="info-val">${from} &rarr; ${to}</div></div>
    </div>`;

  if (status === 'in progress' && b.timerStart) {
    renderInProgress(b, firstName, infoStrip);
  } else if (status === 'complete' && b.timerEnd) {
    renderComplete(b, firstName, infoStrip);
  } else {
    renderArrived(b, firstName, infoStrip);
  }
}

function renderArrived(b, firstName, infoStrip) {
  stopTimers();
  document.getElementById('main-card').innerHTML = `
    <div class="card-header">
      <div class="status-badge badge-arrived">&#128666; Crew Arrived</div>
      <div class="card-title">Your movers are here,<br><span>${firstName}!</span></div>
      <div class="card-sub">Tap the button below to officially sign in your crew and start the clock.</div>
    </div>
    ${infoStrip}
    <div class="signin-section">
      <span class="truck-emoji">&#128666;</span>
      <div class="signin-title">Ready to start your move?</div>
      <div class="signin-sub">Once you tap this button, your move clock starts for both you and your crew. Your rate of ${b.rate} begins at that moment.</div>
      <button class="btn-signin" id="signin-btn" onclick="signInMovers()">Sign In My Movers -- Start the Clock</button>
      <div class="warning-note" id="signin-warn" style="display:none;"></div>
    </div>
    <div class="footer-contact">Questions? Text us at <a href="sms:+15403001414">(540) 300-1414</a></div>`;
}

function renderInProgress(b, firstName, infoStrip) {
  document.getElementById('main-card').innerHTML = `
    <div class="card-header">
      <div class="status-badge badge-progress">&#9679; Move In Progress</div>
      <div class="card-title">Your move is<br><span>underway!</span></div>
      <div class="card-sub">Your crew is hard at work. The clock is running.</div>
    </div>
    ${infoStrip}
    <div class="timer-block">
      <div class="timer-label">Time on the job</div>
      <div class="timer-display" id="timer-display">0:00:00</div>
      <div class="timer-note">Running since your crew was signed in &middot; 15-min prorate</div>
    </div>
    <div class="footer-contact" style="margin-bottom:20px;">Questions? Text us at <a href="sms:+15403001414">(540) 300-1414</a></div>`;

  startTimerDisplay(b.timerStart);
}

function renderComplete(b, firstName, infoStrip) {
  stopTimers();

  const elapsedMs   = new Date(b.timerEnd) - new Date(b.timerStart);
  const duration    = formatDuration(elapsedMs);
  const crewNum     = parseInt((b.crew || '2').replace(/\D/g,'')) || 2;
  const rateMap     = { 2: 165, 3: 199 };
  const ratePerHour = rateMap[crewNum] || 165;
  const blocks      = Math.ceil(elapsedMs / (15 * 60 * 1000));
  const hours       = blocks / 4;
  const total       = Math.round(hours * ratePerHour * 100) / 100;
  const deposit     = parseFloat((b.deposit || '').replace(/[^0-9.]/g,'')) || 250;
  const charged     = Math.max(0, Math.round((total - deposit) * 100) / 100);

  document.getElementById('main-card').innerHTML = `
    <div class="card-header">
      <div class="status-badge badge-done">&#10003; Move Complete</div>
      <div class="card-title">All done,<br><span>${firstName}!</span></div>
      <div class="card-sub">Your crew finished in ${duration}. Your card has been charged and a receipt was emailed to you.</div>
    </div>
    ${infoStrip}
    <div class="done-section">
      <span class="done-icon">&#127968;</span>
      <div class="done-title">Welcome to your new home.</div>
      <div class="done-sub">Thank you for choosing VYV Moving. We hope the move was smooth!</div>
    </div>
    <div class="receipt-strip">
      <div class="receipt-row"><span class="r-label">Time on the job</span><span class="r-val">${duration}</span></div>
      <div class="receipt-row"><span class="r-label">Rate</span><span class="r-val">$${ratePerHour}/hr</span></div>
      <div class="receipt-row r-total"><span class="r-label">Total</span><span class="r-val">$${total.toFixed(2)}</span></div>
      <div class="receipt-row"><span class="r-label">Deposit paid</span><span class="r-val">-$${deposit.toFixed(2)}</span></div>
    </div>
    <div class="r-charged receipt-strip" style="background:#d4eddf;border-top:none;">
      <div class="receipt-row r-charged" style="border:none;"><span class="r-label">&#10003; Charged to card</span><span class="r-val">$${charged.toFixed(2)}</span></div>
    </div>
    <div class="footer-contact" style="margin-bottom:20px;">Questions? Text us at <a href="sms:+15403001414">(540) 300-1414</a></div>`;
}

async function signInMovers() {
  const btn  = document.getElementById('signin-btn');
  const warn = document.getElementById('signin-warn');
  btn.disabled = true;
  btn.classList.add('loading');
  btn.textContent = 'Starting your move...';
  warn.style.display = 'none';

  try {
    const r = await fetch(SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'start_timer', id: bookingId, moveToken })
    });
    const d = await r.json();
    if (d.ok) {
      currentBooking.timerStart = d.timerStart;
      currentBooking.status = 'In Progress';
      render(currentBooking);
    } else {
      btn.disabled = false;
      btn.classList.remove('loading');
      btn.textContent = 'Sign In My Movers -- Start the Clock';
      warn.textContent = d.error || 'Something went wrong. Please refresh and try again.';
      warn.style.display = 'block';
    }
  } catch {
    btn.disabled = false;
    btn.classList.remove('loading');
    btn.textContent = 'Sign In My Movers -- Start the Clock';
    warn.textContent = 'No connection. Check your signal and try again.';
    warn.style.display = 'block';
  }
}

function startTimerDisplay(timerStart) {
  const start = new Date(timerStart);
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    const elapsed = Date.now() - start.getTime();
    const el = document.getElementById('timer-display');
    if (el) el.textContent = formatElapsed(elapsed);
  }, 1000);

  // Poll for status change (move complete)
  if (pollInterval) clearInterval(pollInterval);
  pollInterval = setInterval(async () => {
    try {
      const r = await fetch(`${SCRIPT_URL}?action=get_move&id=${encodeURIComponent(bookingId)}&moveToken=${encodeURIComponent(moveToken)}`);
      const d = await r.json();
      if (d.ok && d.booking.status.toLowerCase() === 'complete') {
        currentBooking = d.booking;
        render(d.booking);
      }
    } catch {}
  }, 10000);
}

function stopTimers() {
  if (timerInterval) clearInterval(timerInterval);
  if (pollInterval)  clearInterval(pollInterval);
}

function formatElapsed(ms) {
  const s  = Math.floor(ms / 1000);
  const h  = Math.floor(s / 3600);
  const m  = Math.floor((s % 3600) / 60);
  const sc = s % 60;
  return `${h}:${String(m).padStart(2,'0')}:${String(sc).padStart(2,'0')}`;
}

function formatDuration(ms) {
  const totalMin = Math.floor(ms / 60000);
  const h = Math.floor(totalMin / 60);
  const m = totalMin % 60;
  return h > 0 ? `${h} hr ${m} min` : `${m} min`;
}

function cityOnly(addr) {
  if (!addr) return '?';
  const parts = addr.split(',');
  return (parts[1] || parts[0]).trim().split(' ').slice(0,2).join(' ');
}

function showError(msg) {
  document.getElementById('main-card').innerHTML = `
    <div class="error-wrap">
      <div style="font-size:2rem;margin-bottom:10px;">&#128683;</div>
      <div>${msg}</div>
    </div>`;
}

fetchMove();
</script>
</body>
</html>
